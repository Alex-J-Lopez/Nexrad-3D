<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Nexrad 3D icon</title>
  <desc id="desc">Radar sweep over concentric ranges with a cloud grid accent.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2937" />
      <stop offset="100%" stop-color="#051018" />
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19ff9b" stop-opacity="0" />
      <stop offset="100%" stop-color="#65ffd4" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)" />

  <g stroke="#3dcf9b" stroke-opacity="0.55" fill="none">
    <circle cx="128" cy="128" r="30" />
    <circle cx="128" cy="128" r="56" />
    <circle cx="128" cy="128" r="84" />
    <circle cx="128" cy="128" r="110" />
    <line x1="18" y1="128" x2="238" y2="128" />
    <line x1="128" y1="18" x2="128" y2="238" />
  </g>

  <path d="M128 128 L230 66 A120 120 0 0 1 190 30 Z" fill="url(#sweep)" filter="url(#softGlow)" />

  <g fill="#77ffd8" filter="url(#softGlow)">
    <circle cx="174" cy="102" r="6" />
    <circle cx="147" cy="77" r="4.5" />
    <circle cx="198" cy="86" r="4" />
  </g>

  <g stroke="#8fe4ff" stroke-opacity="0.45" stroke-width="2">
    <path d="M40 196 H216" />
    <path d="M54 182 H202" />
    <path d="M68 168 H188" />
  </g>
</svg>
