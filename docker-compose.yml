services:
  redis:
    image: redis:7-alpine
    container_name: nexrad-3d-redis
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    container_name: nexrad-3d-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINIO_DATA_PATH:-minio-data}:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin); do
        echo 'waiting for minio...' && sleep 1;
      done;
      /usr/bin/mc mb -p local/radar-data || true;
      exit 0;
      "

  nexrad:
    build:
      context: .
      dockerfile: apps/nexrad/Dockerfile
    container_name: nexrad-3d-app
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: radar-data
      S3_REGION: us-east-1
      POLL_INTERVAL_SECONDS: "30"
    depends_on:
      - redis
      - minio
      - minio-init
    restart: unless-stopped

  # Polls NOAA NEXRAD Level II, decodes volumes, writes Redis + MinIO (required for data in the UI).
  ingest-worker:
    build:
      context: .
      dockerfile: services/ingest-worker/Dockerfile
    container_name: nexrad-3d-ingest
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: radar-data
      POLL_INTERVAL_SECONDS: "30"
      INGEST_FILE_TIMEOUT_MS: "120000"
      INGEST_FETCH_TIMEOUT_MS: "20000"
      OBJECT_STORAGE_ENABLED: "true"
      NOAA_BASE_URL: ${NOAA_BASE_URL}
    depends_on:
      - redis
      - minio
      - minio-init
    restart: unless-stopped

volumes:
  minio-data:

networks:
  default:
    name: nexrad_net
    external: true
